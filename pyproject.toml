[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "coreason_etl_mhra_products"
dynamic = ["version"]
description = "ETL process integrating UK MHRA regulatory and pharmacovigilance safety data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Akshaya M", email = "akshaya.movvar@coreason.ai" },
]
dependencies = [
    "dbt-postgres>=1.10.0",
    "dlt[postgres]>=1.23.0",
    "loguru>=0.7.2",
    "polars>=1.39.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "deptry",
    "types-requests",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coreason_etl_mhra_products"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF", "ARG", "C4", "PT", "TCH", "FA", "PIE", "RET", "PERF", "N", "A", "S"]
ignore = ["S101", "UP037"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.deptry.per_rule_ignores]
DEP002 = ["dlt", "polars", "requests", "dbt-postgres", "pydantic"]
DEP003 = ["urllib3"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=100"
testpaths = ["tests"]
